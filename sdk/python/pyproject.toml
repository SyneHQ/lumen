[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-sdk"
version = "1.0.0"
description = "Official Python client SDK for Lumen event ingestion service"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Syne HQ" }]
keywords = ["lumen", "telemetry", "analytics", "events", "clickhouse"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/SyneHQ/lumen"
Source = "https://github.com/SyneHQ/lumen/tree/main/sdk/python"
Issues = "https://github.com/SyneHQ/lumen/issues"
