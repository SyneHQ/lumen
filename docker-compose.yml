services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: lumen-clickhouse
    ports:
      - "8123:8123" # HTTP interface
      - "9001:9000" # Native interface
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DB: lumen
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: lumen-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: lumen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  lumen:
    build: .
    container_name: lumen-service
    ports:
      - "9090:9090"
    # NOTE: ingest (50051) and admin (50052) are intentionally NOT published to the
    # host here — Caddy is the only public entrypoint, reaching lumen over the
    # docker network. Admin stays cluster-internal entirely.
    environment:
      CLICKHOUSE_DSN: "clickhouse://clickhouse:9000/lumen?dial_timeout=10s&compress=true"
      POSTGRES_DSN: "postgres://postgres:postgres@postgres:5432/lumen?sslmode=disable"
      # Required. No default exists. Generate with: openssl rand -hex 32
      # Set in a .env file or your secret manager; do NOT commit a real value.
      ADMIN_TOKEN: "${ADMIN_TOKEN:?ADMIN_TOKEN is required - run: export ADMIN_TOKEN=$(openssl rand -hex 32)}"
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy

  caddy:
    build: ./caddy
    container_name: lumen-caddy
    ports:
      - "50052:50052" # public TLS entrypoint for lumen ingest (Identify/Track)
    environment:
      # Cloudflare API token, needs Zone:DNS:Edit for the zone, for DNS-01 ACME challenge.
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required for TLS cert issuance}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - lumen

volumes:
  caddy_data:
  caddy_config:
